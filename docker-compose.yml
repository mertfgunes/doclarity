version: "3.9"

services:
  postgres:
    image: ankane/pgvector:latest   # Postgres + pgvector extension baked in
    container_name: doclarity_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: doclarity
      POSTGRES_PASSWORD: doclarity
      POSTGRES_DB: doclarity
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    container_name: doclarity_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pg_data:
