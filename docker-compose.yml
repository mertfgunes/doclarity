version: "3.9"

services:
  postgres:
    image: ankane/pgvector:latest   # Postgres + pgvector extension baked in
    container_name: docintel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: docintel
      POSTGRES_PASSWORD: docintel
      POSTGRES_DB: docintel
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: docintel_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pg_data:
