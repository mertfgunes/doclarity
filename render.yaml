envVarGroups:
  # Shared secret between doclarity-ollama's auth proxy and the
  # services that call it - see deploy/ollama/proxy.py for why.
  - name: doclarity-shared
    envVars:
      - key: OLLAMA_API_KEY
        generateValue: true

databases:
  - name: doclarity-db
    databaseName: doclarity
    user: doclarity
    plan: free
    postgresMajorVersion: 16

services:
  - type: redis
    name: doclarity-redis
    plan: free
    ipAllowList: []

  # Runs the Ollama models (chat + embeddings). This has to be a public web
  # service, not a private service, because Render's free workspace plan
  # doesn't allow private services at all. Since Ollama itself has no auth,
  # deploy/ollama wraps it in a tiny proxy that requires the OLLAMA_API_KEY
  # bearer token on every request. Free plan also has no disk support, so
  # models re-download on every restart/spin-down, and 512MB RAM is likely
  # too little to load them reliably - bump to a paid plan (and add back a
  # disk) if this is too slow or OOMs.
  - type: web
    name: doclarity-ollama
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/ollama/Dockerfile
    dockerContext: ./deploy/ollama
    envVars:
      - fromGroup: doclarity-shared

  - type: web
    name: doclarity-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Render's default Python (3.13) has no prebuilt pandas 2.2.3 wheel,
      # so it compiles from source - painfully slow on free tier's CPU.
      # 3.12 has a wheel.
      - key: PYTHON_VERSION
        value: 3.12.3
      - fromGroup: doclarity-shared
      - key: DATABASE_URL
        fromDatabase:
          name: doclarity-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: doclarity-redis
          property: connectionString
      # Least-privilege SELECT-only role for Slice 4 analytics SQL - create
      # it by running db/init/01_readonly_role.sql against DATABASE_URL once,
      # then paste its connection string here.
      - key: ANALYTICS_DATABASE_URL
        sync: false
      - key: LLM_PROVIDER
        value: ollama
      - key: EMBEDDING_PROVIDER
        value: ollama
      # Fill in with doclarity-ollama's public URL shown on its Render
      # dashboard page (e.g. https://doclarity-ollama.onrender.com) -
      # requests need the OLLAMA_API_KEY bearer token, which the app adds
      # automatically once that's set.
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_CHAT_MODEL
        value: llama3.2:3b
      - key: OLLAMA_EMBED_MODEL
        value: nomic-embed-text
      - key: JWT_SECRET_KEY
        generateValue: true
      # No S3/R2 bucket set up - local disk instead. Render's free plan has
      # no persistent disk, so uploaded files are lost on every restart/
      # spin-down. Switch to "s3" once a bucket is available.
      - key: STORAGE_BACKEND
        value: local
      # Vercel frontend URL(s), comma-separated
      - key: CORS_ORIGINS
        sync: false
      - key: ENVIRONMENT
        value: production

  # Runs the Celery worker. This has to be a "web" service, not a
  # background worker, because Render's free workspace plan doesn't allow
  # background workers either (same restriction as private services on
  # doclarity-ollama above). The Celery process runs in the background of
  # the same container; the foreground process is only a stub HTTP server
  # so Render's health check has something to see on $PORT.
  - type: web
    name: doclarity-worker
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # --concurrency=2: default prefork concurrency (one process per CPU
    # core, reported as 8 here) OOMs on free tier's 512MB RAM.
    startCommand: (celery -A app.core.celery_app worker --loglevel=info --concurrency=2 &) && python -m http.server $PORT
    envVars:
      # See doclarity-backend's PYTHON_VERSION for why.
      - key: PYTHON_VERSION
        value: 3.12.3
      - fromGroup: doclarity-shared
      - key: DATABASE_URL
        fromDatabase:
          name: doclarity-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: doclarity-redis
          property: connectionString
      - key: LLM_PROVIDER
        value: ollama
      - key: EMBEDDING_PROVIDER
        value: ollama
      # Same public URL as doclarity-backend's OLLAMA_BASE_URL above.
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_CHAT_MODEL
        value: llama3.2:3b
      - key: OLLAMA_EMBED_MODEL
        value: nomic-embed-text
      # See doclarity-backend's STORAGE_BACKEND for why this is local.
      - key: STORAGE_BACKEND
        value: local
      - key: ENVIRONMENT
        value: production
